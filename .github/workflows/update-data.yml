name: Update data cache

on:
  schedule:
    - cron: "17 * * * *"
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: data-cache-writes
  cancel-in-progress: false

jobs:
  update:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Install dependencies
        run: npm install --no-audit --no-fund

      - name: Update data files
        run: npm run update:data

      - name: Update shared assets
        run: npm run update:assets

      - name: Update event plans
        run: npm run update:events

      - name: Commit changes if needed
        run: |
          git config user.name "github-actions"
          git config user.email "github-actions@github.com"

          git add package.json package-lock.json public/data/ public/assets/ public/events/

          if git diff --cached --quiet; then
            echo "No changes detected."
          else
            git commit -m "Update data cache"
            git push
          fi
