name: Discover E4K test loader

on:
  workflow_dispatch:

permissions:
  actions: write
  contents: write

concurrency:
  group: data-cache-writes
  cancel-in-progress: false

jobs:
  discover:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install dependencies
        run: python -m pip install --disable-pip-version-check requests xmltodict

      - name: Discover latest test loader
        run: python scripts/discover-e4k-loader.py --output config/e4k-loader.json

      - name: Extract selected E4K item assets
        run: python scripts/update-e4k-assets.py --config config/e4k-loader.json --output public/assets/e4k

      - name: Check whether loader or assets changed
        id: changes
        shell: bash
        run: |
          git add config/e4k-loader.json public/assets/e4k/
          if git diff --cached --quiet; then
            echo "changed=false" >> "$GITHUB_OUTPUT"
            echo "Loader and selected assets are already current."
          else
            echo "changed=true" >> "$GITHUB_OUTPUT"
          fi

      - name: Commit discovered loader and assets
        if: steps.changes.outputs.changed == 'true'
        run: |
          git config user.name "github-actions"
          git config user.email "github-actions@github.com"
          git commit -m "Update discovered E4K loader and item assets"
          git pull --rebase origin "$GITHUB_REF_NAME"
          git push origin "HEAD:$GITHUB_REF_NAME"

      - name: Start data cache update
        if: steps.changes.outputs.changed == 'true'
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: gh workflow run update-data.yml --ref "$GITHUB_REF_NAME"
